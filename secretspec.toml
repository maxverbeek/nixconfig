[project]
name = "nixconfig"
revision = "1.0"

# No [profiles.default]: secretspec 0.18 rejects a profile with zero secrets, so
# the previously-empty default is dropped. Each service profile below is scoped to
# its own secrets and invoked explicitly with `-P <profile>`.

[profiles.breadhero]
breadhero_slack_bot_token = { description = "Slack bot token for breadhero", required = true }
breadhero_slack_signing_secret = { description = "Slack signing secret for breadhero", required = true }
breadhero_leaderboard_api_key = { description = "Leaderboard API key for breadhero", required = true }

[profiles.feedbackers]
feedback_slack_bot_token = { description = "Slack bot token for feedbackers", required = true }
feedback_slack_signing_secret = { description = "Slack signing secret for feedbackers", required = true }
claude_code_oauth_token = { description = "Claude Code OAuth token for feedbackers", required = true }

[profiles.harmonia]
binary_cache_scopecreep_1_secret = { description = "Harmonia binary cache signing key (secret half)", required = true }
binary_cache_scopecreep_1_public = { description = "Harmonia binary cache signing key (public half)", required = true }

[profiles.webdav]
webdav_username = { description = "WebDAV basic-auth username", required = true }
webdav_password = { description = "WebDAV basic-auth password", required = true }

[profiles.huurhunter]
huurhunter_telegram_bot_token = { description = "Telegram bot token for huurhunter notifications", required = true }
huurhunter_telegram_chat_id = { description = "Telegram chat id to send huurhunter notifications to", required = true }
